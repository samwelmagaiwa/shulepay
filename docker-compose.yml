services:

  # ── MySQL Database ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: shulepay_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-shulepay}
      MYSQL_USER: ${DB_USERNAME:-shulepay}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"       # exposed on 3307 so it doesn't clash with local MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shulepay_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-shulepay}
      DB_USERNAME: ${DB_USERNAME:-shulepay}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SMS_DRIVER: ${SMS_DRIVER:-kilakona}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-ShulePay}
    volumes:
      - backend_storage:/var/www/html/storage
    expose:
      - "9000"

  # ── Vue Frontend (Nginx) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shulepay_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      FRONTEND_SERVER_NAME: localhost
      BACKEND_UPSTREAM: http://backend:9000
    ports:
      - "80:80"

volumes:
  db_data:
  backend_storage:
