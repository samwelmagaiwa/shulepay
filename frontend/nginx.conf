server {
    listen 80;
    server_name ${FRONTEND_SERVER_NAME};

    client_max_body_size 10m;

    # Security headers — applies to every location in this server block.
    # CSP allows Google Fonts (loaded by ServiceTrendChart.vue on the live
    # dashboard) and 'unsafe-inline' for style because Vue/CoreUI apply inline
    # `style` attributes at runtime — much lower risk than script injection and
    # not practical to eliminate without a large rework.
    #
    # script-src no longer needs 'unsafe-inline': the dark-mode detector that
    # used to be an inline <script> in index.html now lives at /theme-init.js,
    # a same-origin external file that needs no CSP exception at all.
    #
    # 'unsafe-eval' is still required — without it the entire bundle fails to
    # run (confirmed: blank page, "Evaluating a string as JavaScript violates
    # ... script-src" in console). Root-caused to vue-i18n's runtime message
    # compiler, which calls `new Function(...)` the first time each message
    # string is used. Precompiling messages at build time via
    # @intlify/unplugin-vue-i18n (runtimeOnly mode) removes the eval calls
    # from the bundle (verified: zero `new Function(`/`eval(` hits in dist/),
    # but something in that build — not yet isolated past "not the plugin's
    # runtimeOnly/compositionOnly options, since it still fails with only
    # message precompilation and the standard vue-i18n build" — throws a
    # SyntaxError (intlify error code 24) at module init, before the app even
    # renders. That is a real bug to chase down, not a CSP question; reverted
    # rather than ship a blank production site. 'unsafe-eval' only permits
    # same-origin code to eval; it does not allow loading scripts from other
    # origins, which stays blocked by script-src 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # frame-src/object-src must allow blob: — receipts and statements are fetched
    # through the API (so the auth token is attached) and previewed from a blob URL.
    # Without these directives they fall back to default-src 'self', a blob: URL is
    # not 'self', and the viewer shows "This content is blocked" instead of the PDF.
    # blob: URLs are created by this origin's own script and cannot be set remotely.
    # frame-ancestors 'none' still stops anyone embedding this app in their page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /storage/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
