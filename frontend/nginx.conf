server {
    listen 80;
    server_name ${FRONTEND_SERVER_NAME};

    client_max_body_size 10m;

    # Security headers — applies to every location in this server block.
    # CSP allows Google Fonts (loaded by ServiceTrendChart.vue on the live
    # dashboard) and 'unsafe-inline' for script/style because index.html has an
    # inline dark-mode-detector <script> and Vue/CoreUI apply inline styles at
    # runtime. 'unsafe-eval' is required too — without it the entire bundle
    # failed to run at all (confirmed by testing this exact config: blank page,
    # "Evaluating a string as JavaScript violates ... script-src" in console).
    # Something in the production bundle calls eval()/Function() — most likely a
    # bundled dependency, not app code. 'unsafe-eval' only permits same-origin
    # code to do that; it does not allow loading scripts from other origins,
    # which remains blocked by script-src 'self' — the main protection CSP
    # provides here stays intact.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # frame-src/object-src must allow blob: — receipts and statements are fetched
    # through the API (so the auth token is attached) and previewed from a blob URL.
    # Without these directives they fall back to default-src 'self', a blob: URL is
    # not 'self', and the viewer shows "This content is blocked" instead of the PDF.
    # blob: URLs are created by this origin's own script and cannot be set remotely.
    # frame-ancestors 'none' still stops anyone embedding this app in their page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /storage/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
