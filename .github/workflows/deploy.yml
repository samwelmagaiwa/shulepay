name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BACKEND_IMAGE:  magaiwa/magreth-backend
  FRONTEND_IMAGE: magaiwa/magreth-frontend

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — BACKEND CHECKS (lint + tests)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  backend-checks:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: shulepay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set test DB config
        working-directory: backend
        run: |
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=shulepay_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run PHP linter (Pint)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run tests
        working-directory: backend
        run: php artisan test

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2 — FRONTEND CHECKS (lint + build check)
  # ══════════════════════════════════════════════════════════════════════════════
  frontend-checks:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3a — BUILD & PUSH BACKEND IMAGE (parallel with 3b)
  # ══════════════════════════════════════════════════════════════════════════════
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3b — BUILD & PUSH FRONTEND IMAGE (parallel with 3a)
  # ══════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 4 — DEPLOY TO SERVER
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare server and write .env
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SECRET_KEY: ${{ secrets.SMS_SECRET_KEY }}
          SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_KEY,DB_PASSWORD,DB_ROOT_PASSWORD,SMS_API_KEY,SMS_SECRET_KEY,SMS_SENDER_ID,DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            mkdir -p /www/shulepay
            printf 'APP_ENV=production\n'                  > /www/shulepay/.env
            printf 'APP_DEBUG=false\n'                    >> /www/shulepay/.env
            printf 'DB_CONNECTION=mysql\n'                >> /www/shulepay/.env
            printf 'APP_KEY=%s\n' "$APP_KEY"              >> /www/shulepay/.env
            printf 'APP_URL=https://magrethschools.sc.tz\n' >> /www/shulepay/.env
            printf 'DB_DATABASE=shulepay\n'               >> /www/shulepay/.env
            printf 'DB_USERNAME=shulepay\n'               >> /www/shulepay/.env
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"      >> /www/shulepay/.env
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD" >> /www/shulepay/.env
            printf 'SMS_DRIVER=kilakona\n'                >> /www/shulepay/.env
            printf 'SMS_API_KEY=%s\n' "$SMS_API_KEY"      >> /www/shulepay/.env
            printf 'SMS_SECRET_KEY=%s\n' "$SMS_SECRET_KEY" >> /www/shulepay/.env
            printf 'SMS_SENDER_ID="%s"\n' "$SMS_SENDER_ID"  >> /www/shulepay/.env
            printf 'SMS_COUNTRY_CODE=255\n'                 >> /www/shulepay/.env
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" >> /www/shulepay/.env
            printf 'BACKEND_IMAGE=magaiwa/magreth-backend\n'    >> /www/shulepay/.env
            printf 'FRONTEND_IMAGE=magaiwa/magreth-frontend\n'  >> /www/shulepay/.env
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"          >> /www/shulepay/.env
            chmod 600 /www/shulepay/.env

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy.sh"
          target: "/www/shulepay"

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /www/shulepay
            chmod +x deploy.sh
            ./deploy.sh deploy
