server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;

    client_max_body_size 10m;

    # Serve uploaded files directly from the storage volume — no symlink needed
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # An SVG can carry script: shown as a picture it is fine, opened as a page it must run nothing
        if ($uri ~* \.svg$) {
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, immutable";
        }
    }

    # Uploaded files are data, never code
    location ~* ^/storage/.*\.(php|phtml|phar|pht|php[0-9])$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # The assistant (/api/ai/chat) can wait on the AI provider and several tool calls.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # Dotfiles (.env, .git, .htaccess ...) are never served; .well-known stays reachable
    location ~ /\.(?!well-known) {
        deny all;
    }
}
