services:

  backend:
    image: ${DOCKERHUB_USERNAME}/magreth-backend:latest
    container_name: shulepay_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-shulepay}
      DB_USERNAME: ${DB_USERNAME:-shulepay}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SMS_DRIVER: kilakona
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-ShulePay}
    volumes:
      - backend_storage:/var/www/html/storage
    expose:
      - "80"

  frontend:
    image: ${DOCKERHUB_USERNAME}/magreth-frontend:latest
    container_name: shulepay_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      FRONTEND_SERVER_NAME: magrethschools.sc.tz
      BACKEND_UPSTREAM: http://backend:80
    ports:
      - "127.0.0.1:8080:80"

volumes:
  backend_storage:
